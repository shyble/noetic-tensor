[package]
name = "noetic-tensor"
version = "0.4.0"
edition = "2021"
description = "A deterministic tensor engine with reverse-mode autodiff and a neural-network library, on the CPU, Apple Metal and NVIDIA CUDA, with almost no dependencies."
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["tensor", "autodiff", "neural-network", "metal", "cuda"]
categories = ["science", "mathematics"]

[lib]
# Imported as `use noetic::tensor::…` and `use noetic::nn::…`.
name = "noetic"

[dependencies]
rand = "0.8"
rand_chacha = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10"
# The gemm kernel behind the reference backend, called directly. Pinned: the bit-exact outputs
# depend on it (it is part of the platform key).
matrixmultiply = { version = "=0.3.11", default-features = false, features = ["std"] }

[[example]]
# Its tests (the launch command's refusals) run with `cargo test`.
name = "launch"
test = true

[features]
# NVIDIA CUDA: links the system CUDA driver, NVRTC and cuBLAS through hand-written FFI (no crates).
cuda = []
# Apple Metal (macOS only): links Metal.framework, Foundation and libobjc (system libraries, no crates).
metal = []

[profile.release]
opt-level = 3
debug = 1
