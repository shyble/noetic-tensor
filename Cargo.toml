[package]
name = "noetic-tensor"
version = "0.1.0"
edition = "2021"
description = "A deterministic tensor engine with reverse-mode autodiff and a neural-network library, on the CPU, Apple Metal and NVIDIA CUDA, with almost no dependencies."
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["tensor", "autodiff", "neural-network", "metal", "cuda"]
categories = ["science", "mathematics"]

[dependencies]
rand = "0.8"
rand_chacha = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# The gemm kernel behind the reference backend. Pinned: the bit-exact outputs depend on it.
matrixmultiply = { version = "=0.3.11", default-features = false, features = ["std"] }

[features]
# NVIDIA CUDA: links the system CUDA driver, NVRTC and cuBLAS through hand-written FFI (no crates).
cuda = []
# Apple Metal (macOS only): links Metal.framework, Foundation and libobjc (system libraries, no crates).
metal = []

[profile.release]
opt-level = 3
debug = 1
